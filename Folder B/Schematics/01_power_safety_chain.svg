<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#FFFFFF"/><text x="56" y="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#1B1F24" text-anchor="start" font-weight="700"><tspan x="56" dy="0">Power and safety chain</tspan></text><text x="56" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5B6470" text-anchor="start" font-weight="400"><tspan x="56" dy="0">The mandatory ON/OFF switch and Emergency Stop, and why they sit where they do in the circuit</tspan></text><line x1="56" y1="102" x2="1544" y2="102" stroke="#DDE1E6" stroke-width="1.5" stroke-linecap="round"/><text x="1544" y="50" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#98A0AA" text-anchor="end" font-weight="400"><tspan x="1544" dy="0">Team CO Coders  ·  Lightning McQueen</tspan></text><text x="1544" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#98A0AA" text-anchor="end" font-weight="400"><tspan x="1544" dy="0">Robo Rumble 2026  ·  Robo Grand Prix</tspan></text><line x1="136" y1="280" x2="158" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="158" y1="264" x2="158" y2="296" stroke="#1B1F24" stroke-width="2.6" stroke-linecap="round"/><line x1="166" y1="272" x2="166" y2="288" stroke="#1B1F24" stroke-width="2.6" stroke-linecap="round"/><line x1="174" y1="264" x2="174" y2="296" stroke="#1B1F24" stroke-width="2.6" stroke-linecap="round"/><line x1="182" y1="272" x2="182" y2="288" stroke="#1B1F24" stroke-width="2.6" stroke-linecap="round"/><line x1="182" y1="280" x2="204" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="170" y="224" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="middle" font-weight="400"><tspan x="170" dy="0">BT1 · BT2</tspan><tspan x="170" dy="14.850000000000001">2 × 9 V PP3</tspan><tspan x="170" dy="14.850000000000001">9 V nominal, ~1.2 Ah</tspan></text><line x1="204" y1="280" x2="254" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="254" y1="280" x2="266" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><rect x="266" y="269" width="48" height="22" rx="4" fill="none" stroke="#1B1F24" stroke-width="2.0"/><polyline points="266,280 277,273 290,287 303,273 314,280" fill="none" stroke="#1B1F24" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="314" y1="280" x2="326" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="290" y="314" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="middle" font-weight="400"><tspan x="290" dy="0">F1</tspan><tspan x="290" dy="14.850000000000001">2 A resettable polyfuse</tspan></text><line x1="326" y1="280" x2="386" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="386" y1="280" x2="413" y2="280" stroke="#C4211D" stroke-width="2.8" stroke-linecap="round"/><circle cx="413" cy="280" r="4.5" fill="#FFFFFF" stroke="#C4211D" stroke-width="2.4"/><circle cx="447" cy="280" r="4.5" fill="#FFFFFF" stroke="#C4211D" stroke-width="2.4"/><line x1="413" y1="275.5" x2="447" y2="275.5" stroke="#C4211D" stroke-width="2.8" stroke-linecap="round"/><line x1="447" y1="280" x2="474" y2="280" stroke="#C4211D" stroke-width="2.8" stroke-linecap="round"/><line x1="430" y1="275.5" x2="430" y2="252" stroke="#C4211D" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5,4"/><rect x="406" y="236" width="48" height="16" rx="8" fill="#C4211D"/><text x="430" y="224" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C4211D" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">SW1   E-STOP</tspan></text><text x="430" y="314" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#C4211D" text-anchor="middle" font-weight="400"><tspan x="430" dy="0">normally closed · latching</tspan></text><line x1="474" y1="280" x2="548" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="548" y1="280" x2="573" y2="280" stroke="#2C6FA8" stroke-width="2.8" stroke-linecap="round"/><circle cx="573" cy="280" r="4.5" fill="#FFFFFF" stroke="#2C6FA8" stroke-width="2.4"/><circle cx="607" cy="280" r="4.5" fill="#FFFFFF" stroke="#2C6FA8" stroke-width="2.4"/><line x1="576" y1="278" x2="606" y2="262" stroke="#2C6FA8" stroke-width="2.8" stroke-linecap="round"/><line x1="607" y1="280" x2="632" y2="280" stroke="#2C6FA8" stroke-width="2.8" stroke-linecap="round"/><text x="590" y="244" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2C6FA8" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">SW2   ON/OFF</tspan></text><text x="590" y="314" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#2C6FA8" text-anchor="middle" font-weight="400"><tspan x="590" dy="0">SPST rocker</tspan></text><line x1="632" y1="280" x2="740" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><circle cx="740" cy="280" r="4.5" fill="#1B1F24"/><text x="740" y="254" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1B1F24" text-anchor="middle" font-weight="600"><tspan x="740" dy="0">V-MOTOR RAIL   switched +9 V</tspan></text><line x1="740" y1="280" x2="740" y2="342" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="740" y1="342" x2="690" y2="342" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="690" y1="342" x2="690" y2="352" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><rect x="681" y="352" width="18" height="40" rx="3" fill="none" stroke="#1B1F24" stroke-width="2.0"/><line x1="690" y1="392" x2="690" y2="402" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="707" y="376" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="start" font-weight="400"><tspan x="707" dy="0">R1   1 kΩ</tspan></text><line x1="690" y1="412" x2="690" y2="429" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><polygon points="677,429 703,429 690,450" fill="none" stroke="#9A6800" stroke-width="2"/><line x1="676" y1="450" x2="704" y2="450" stroke="#9A6800" stroke-width="2.4" stroke-linecap="round"/><line x1="690" y1="450" x2="690" y2="472" stroke="#9A6800" stroke-width="2.0" stroke-linecap="round"/><polyline points="706,430 718,418" fill="none" stroke="#9A6800" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="718,418 712,420 716,424" fill="none" stroke="#9A6800" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="711,438 723,426" fill="none" stroke="#9A6800" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="723,426 717,428 721,432" fill="none" stroke="#9A6800" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="730" y="446" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9A6800" text-anchor="start" font-weight="400"><tspan x="730" dy="0">D1   POWER ON</tspan></text><line x1="690" y1="472" x2="690" y2="504" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="690" y1="504" x2="690" y2="518" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="678.0" y1="518" x2="702.0" y2="518" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round"/><line x1="682.5" y1="524" x2="697.5" y2="524" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round"/><line x1="686.5" y1="530" x2="693.5" y2="530" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round"/><line x1="740" y1="280" x2="870" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><rect x="870" y="220" width="250" height="260" rx="9" fill="#FFF6E0" stroke="#9A6800" stroke-width="2.2"/><text x="995.0" y="248" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9A6800" text-anchor="middle" font-weight="700"><tspan x="995.0" dy="0">U1   L298N</tspan></text><text x="995.0" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#5B6470" text-anchor="middle" font-weight="400"><tspan x="995.0" dy="0">dual H-bridge with</tspan><tspan x="995.0" dy="14.175">on-board 78M05 regulator</tspan></text><line x1="848" y1="280" x2="870" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="880" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="start" font-weight="400"><tspan x="880" dy="0">+12V</tspan></text><line x1="848" y1="445" x2="870" y2="445" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="880" y="449" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="start" font-weight="400"><tspan x="880" dy="0">GND</tspan></text><line x1="1120" y1="280" x2="1142" y2="280" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="1110" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="end" font-weight="400"><tspan x="1110" dy="0">+5V</tspan></text><line x1="1120" y1="360" x2="1142" y2="360" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="1110" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="end" font-weight="400"><tspan x="1110" dy="0">OUT 1/2</tspan></text><line x1="1120" y1="415" x2="1142" y2="415" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><text x="1110" y="419" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1B1F24" text-anchor="end" font-weight="400"><tspan x="1110" dy="0">OUT 3/4</tspan></text><polyline points="1142,280 1250,280" fill="none" stroke="#1F7A4D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1250" cy="280" r="4.5" fill="#1F7A4D"/><text x="1264" y="266" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#1F7A4D" text-anchor="start" font-weight="400"><tspan x="1264" dy="0">+5 V LOGIC RAIL</tspan><tspan x="1264" dy="15.525">→ Arduino Uno 5V pin</tspan><tspan x="1264" dy="15.525">→ TCRT5000 array Vcc</tspan></text><line x1="1142" y1="360" x2="1210" y2="360" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="1142" y1="415" x2="1210" y2="415" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><rect x="1210" y="324" width="250" height="128" rx="9" fill="#FBFCFD" stroke="#1B1F24" stroke-width="2.0"/><text x="1335" y="366" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1B1F24" text-anchor="middle" font-weight="700"><tspan x="1335" dy="0">M1  +  M2</tspan></text><text x="1335" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5B6470" text-anchor="middle" font-weight="400"><tspan x="1335" dy="0">2 × TT gear motor 1:48</tspan><tspan x="1335" dy="14.850000000000001">65 mm wheels · 170 mm track</tspan></text><polyline points="848,445 824,445 824,580 136,580 136,280" fill="none" stroke="#1B1F24" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="580" x2="300" y2="594" stroke="#1B1F24" stroke-width="2.0" stroke-linecap="round"/><line x1="288.0" y1="594" x2="312.0" y2="594" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round"/><line x1="292.5" y1="600" x2="307.5" y2="600" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round"/><line x1="296.5" y1="606" x2="303.5" y2="606" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round"/><text x="346" y="585" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5B6470" text-anchor="start" font-weight="400"><tspan x="346" dy="0">battery negative — single star ground</tspan></text><line x1="430" y1="326" x2="430" y2="690" stroke="#C4211D" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6,5"/><rect x="120" y="700" width="520" height="218" rx="9" fill="#FCEAE9" stroke="#C4211D" stroke-width="2.0"/><text x="135" y="730" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C4211D" text-anchor="start" font-weight="700"><tspan x="135" dy="0">SW1 · E-STOP  —  Universal Design Constraint 4</tspan></text><text x="135" y="756" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#C4211D" text-anchor="start" font-weight="400"><tspan x="135" dy="0">22 mm latching mushroom head, normally closed, on a 48 mm mast at the</tspan><tspan x="135" dy="17.94">rear centreline of the deck. Nothing overhangs it.</tspan><tspan x="135" dy="17.94"></tspan><tspan x="135" dy="17.94">It is the FIRST device in the battery positive line, upstream of SW2 and</tspan><tspan x="135" dy="17.94">of U1. Striking it removes power from the motors, the H-bridge, the 5 V</tspan><tspan x="135" dy="17.94">regulator, the MCU and the sensor array in the same instant. It latches</tspan><tspan x="135" dy="17.94">down, so power cannot restore itself until an operator twists the head</tspan><tspan x="135" dy="17.94">back out. The contact is mechanically in the battery line, so no firmware</tspan><tspan x="135" dy="17.94">path can defeat it.</tspan></text><polyline points="590,326 590,660 800,660 800,700" fill="none" stroke="#2C6FA8" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,5"/><rect x="680" y="700" width="440" height="182" rx="9" fill="#E9F0F8" stroke="#2C6FA8" stroke-width="2.0"/><text x="695" y="730" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2C6FA8" text-anchor="start" font-weight="700"><tspan x="695" dy="0">SW2 · ON/OFF  —  Universal Design Constraint 3</tspan></text><text x="695" y="756" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2C6FA8" text-anchor="start" font-weight="400"><tspan x="695" dy="0">SPST rocker at the rear-left corner of the deck, clear of the</tspan><tspan x="695" dy="17.94">wheels and of the sensor boom.</tspan><tspan x="695" dy="17.94"></tspan><tspan x="695" dy="17.94">Operable with the car sitting on the grid — no lifting, no</tspan><tspan x="695" dy="17.94">tilting, no reaching over a wheel that is about to spin.</tspan><tspan x="695" dy="17.94">It is the normal way to power the car up and down. SW1 is</tspan><tspan x="695" dy="17.94">reserved for stopping a run that has gone wrong.</tspan></text><rect x="1150" y="700" width="400" height="146" rx="9" fill="#F4F5F7" stroke="#5B6470" stroke-width="2.0"/><text x="1165" y="730" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5B6470" text-anchor="start" font-weight="700"><tspan x="1165" dy="0">Downstream of both devices</tspan></text><text x="1165" y="756" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5B6470" text-anchor="start" font-weight="400"><tspan x="1165" dy="0">U1 derives the +5 V logic rail from the same switched</tspan><tspan x="1165" dy="17.94">line, so nothing keeps the MCU alive after a stop. The</tspan><tspan x="1165" dy="17.94">largest capacitor downstream is 100 µF on the L298N</tspan><tspan x="1165" dy="17.94">rail — far too little stored energy to turn a loaded</tspan><tspan x="1165" dy="17.94">TT gearbox even once.</tspan></text></svg>